<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixed Timestep Game Loop with Render Interpolation</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px 0;
        background: #1c1917;
        color: #e7e5e4;
        font-family: system-ui, sans-serif;
      }
      canvas {
        background: #292524;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        justify-content: center;
        max-width: 800px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }
      input[type="range"] {
        width: 160px;
      }
      #hud {
        font-variant-numeric: tabular-nums;
        color: #f472b6;
      }
      code {
        color: #a8a29e;
      }
      .mkare-demo-bar {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 12px;
        line-height: 1;
        color: #e7e5e4;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      .mkare-demo-bar a {
        color: #f472b6;
        text-decoration: none;
        font-weight: 600;
      }
      .mkare-demo-bar a:hover { text-decoration: underline; }
      .mkare-demo-bar .sep { color: #57534e; }
    </style>
  </head>
  <body>
    <nav class="mkare-demo-bar" aria-label="Article and resources">
      <a href="https://javascript.plainenglish.io/metronome-physics-fixed-timestep-game-loops-and-render-interpolation-in-typescript-cdf54ec5ea11?source=friends_link&sk=ff5390a11e2d97b29e82dc41a6572272" target="_blank" rel="noopener">Read Deep Dive (Free)</a>
      <span class="sep">·</span>
      <a href="https://www.buymeacoffee.com/mkare/e/599265" target="_blank" rel="noopener">Get Starter Kit</a>
      <span class="sep">·</span>
      <a href="https://github.com/m2-md/fixed-timestep-render-interpolation" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <canvas id="game" width="800" height="600"></canvas>
    <div class="controls">
      <label><input type="checkbox" id="interp" checked /> Interpolation</label>
      <label><input type="checkbox" id="slow" /> Simulate low FPS</label>
      <label>
        Physics Hz:
        <input type="range" id="hz" min="4" max="60" step="1" value="60" />
        <span id="hzval">60</span>
      </label>
      <span id="hud">— FPS</span>
    </div>
    <p>
      <code
        >Set Physics Hz to 4 → Interpolation OFF teleports, ON
        flows smoothly.</code
      >
    </p>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
